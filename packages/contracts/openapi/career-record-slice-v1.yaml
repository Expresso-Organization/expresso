openapi: 3.1.0
info:
  title: Expresso CareerRecord Spring Slice 1 API
  version: 1.0.0
  description: >-
    CareerRecord의 첫 Spring vertical slice를 위한 언어 중립 계약이다.
    title, propertyValues, blockBody만 새 기록 데이터의 canonical source로 다룬다.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security:
  - bearerAuth: []
tags:
  - name: Career

paths:
  /v1/career/categories:
    get:
      tags: [Career]
      operationId: listCareerCategories
      summary: 기록 생성에 사용할 카테고리와 TEXT 프로퍼티 정의 조회
      responses:
        "200":
          description: 카테고리 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerCategoriesResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
    post:
      tags: [Career]
      operationId: createCustomCareerCategory
      summary: 사용자 custom Career Category 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCareerCategoryRequest"
      responses:
        "201":
          description: 생성된 custom Category
          headers:
            ETag:
              $ref: "#/components/headers/RecordETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPropertySchemaApplyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/career/categories/{categoryId}/property-schema/preview:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    post:
      tags: [Career]
      operationId: previewCareerPropertyDefinitionMutation
      summary: custom Category PropertyDefinition 생성 또는 이름 변경 영향 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerPropertySpringChange"
      responses:
        "200":
          description: 현재 Category version과 PropertyDefinition 변경 단위를 결합한 preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPropertyChangePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"

  /v1/career/categories/{categoryId}/property-schema/apply:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
    post:
      tags: [Career]
      operationId: applyCareerPropertyDefinitionMutation
      summary: preview한 PropertyDefinition 생성 또는 이름 변경을 custom Category에 원자적으로 적용
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCareerPropertyChangeRequest"
      responses:
        "200":
          description: 기존 Web CareerCategory wire contract와 호환되는 변경 결과
          headers:
            ETag:
              $ref: "#/components/headers/RecordETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPropertySchemaApplyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/career/records:
    get:
      tags: [Career]
      operationId: listCareerRecords
      summary: Category별 활성 CareerRecord 목록 조회
      description: >-
        인증 사용자가 소유한 canonical CareerRecord만 categoryId 범위에서
        updatedAt DESC, id DESC 순서로 조회한다. cursor는 서명된 권한 토큰이 아니라
        동일 categoryId 안에서 다음 페이지를 찾기 위한 opaque pagination state다.
      x-pagination:
        style: keyset
        order: ["updatedAt:desc", "id:desc"]
        cursorScope: categoryId
        signed: false
      parameters:
        - name: categoryId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: 안정적으로 정렬된 CareerRecord 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerRecordListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Career]
      operationId: createCareerRecord
      summary: 빈 또는 grouped 초기값을 가진 CareerRecord 생성
      description: >-
        처음 처리하는 Idempotency-Key와 요청은 201을 반환한다. 같은 인증 사용자에게서
        같은 key와 같은 요청이 재전송되면 같은 Record를 200으로 반환하고, 같은 key에
        다른 요청을 보내면 409를 반환한다. 그룹 Quick-Add는 기존 select 또는
        multi-select option 하나를 초기 canonical 값으로 전달할 수 있다.
      x-idempotency:
        scope: authenticated-user
        header: Idempotency-Key
        sameKeySameRequest: return-same-record
        sameKeyDifferentRequest: "409"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCareerRecordRequest"
      responses:
        "201":
          $ref: "#/components/responses/CareerRecordCreated"
        "200":
          $ref: "#/components/responses/CareerRecordReplayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /v1/career/records/{recordId}:
    parameters:
      - $ref: "#/components/parameters/RecordIdPath"
    get:
      tags: [Career]
      operationId: getCareerRecord
      summary: CareerRecord 단건 조회
      responses:
        "200":
          $ref: "#/components/responses/CareerRecordOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"
    patch:
      tags: [Career]
      operationId: patchCareerRecord
      summary: CareerRecord canonical 필드 수정
      description: >-
        If-Match가 현재 version과 일치할 때만 수정한다. 오래된 version이면 412를
        반환한다. 다른 사용자가 소유한 Record도 존재 여부를 숨기기 위해 404를 반환한다.
        title, propertyValues, blockBody는 canonical content 변경이며, status는 별도의
        workflow metadata를 변경하는 status-only 요청으로만 받는다.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCareerRecordRequest"
      responses:
        "200":
          $ref: "#/components/responses/CareerRecordOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
    delete:
      tags: [Career]
      operationId: trashCareerRecord
      summary: CareerRecord 휴지통 이동
      description: >-
        If-Match가 현재 version과 일치하는 활성 canonical Record만 soft delete한다.
        다른 사용자 소유, 이미 삭제된 Record, 존재하지 않는 Record는 404를 반환한다.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          $ref: "#/components/responses/CareerRecordTrashed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/career/records/{recordId}/restore:
    parameters:
      - $ref: "#/components/parameters/RecordIdPath"
    post:
      tags: [Career]
      operationId: restoreCareerRecord
      summary: 삭제된 CareerRecord 복원
      description: >-
        purgeAfter가 지나지 않은 삭제 상태의 canonical Record를 If-Match CAS로 복원한다.
        성공하면 version과 referenceVersion을 각각 정확히 1 증가시킨다.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          $ref: "#/components/responses/CareerRecordOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/career/records/{recordId}/relations:
    parameters:
      - $ref: "#/components/parameters/RecordIdPath"
    put:
      tags: [Career]
      operationId: replaceCareerRelationTargets
      summary: CareerRecord relation 대상 전체 교체
      description: >-
        relation edge 원장의 현재 target set을 요청 target set으로 원자적으로 교체한다.
        If-Match가 현재 source Record version과 일치할 때만 변경하며, 정규화한 target
        set이 현재 값과 같으면 version과 referenceVersion을 변경하지 않는다.
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceCareerRelationTargetsRequest"
      responses:
        "200":
          $ref: "#/components/responses/CareerRecordOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/career/records/{recordId}/move/preview:
    parameters:
      - $ref: "#/components/parameters/RecordIdPath"
    post:
      tags: [Career]
      operationId: previewCareerRecordCategoryMove
      summary: CareerRecord Category 이동 영향 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewCareerCategoryMoveRequest"
      responses:
        "200":
          description: 현재 Record와 Category schema 기준 이동 계획
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerCategoryMovePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"

  /v1/career/records/{recordId}/move:
    parameters:
      - $ref: "#/components/parameters/RecordIdPath"
    post:
      tags: [Career]
      operationId: commitCareerRecordCategoryMove
      summary: 확인한 계획대로 CareerRecord Category 이동
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitCareerCategoryMoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/CareerRecordOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/RecordNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    RecordIdPath:
      name: recordId
      in: path
      required: true
      description: 조회하거나 수정할 CareerRecord ID
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 인증 사용자 범위에서 생성 요청을 식별하는 키
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._~:+\-/]+$'
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: '현재 Record version을 나타내는 strong ETag. 예: "v3"'
      schema:
        $ref: "#/components/schemas/RecordEtag"

  headers:
    RecordETag:
      description: '응답 data.version에서 만든 strong ETag. 형식: "v{version}"'
      schema:
        $ref: "#/components/schemas/RecordEtag"

  responses:
    CareerRecordCreated:
      description: 처음 생성된 CareerRecord
      headers:
        ETag:
          $ref: "#/components/headers/RecordETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerRecordResponse"
    CareerRecordReplayed:
      description: 같은 Idempotency-Key와 같은 요청에 대해 처음 생성했던 CareerRecord
      headers:
        ETag:
          $ref: "#/components/headers/RecordETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerRecordResponse"
    CareerRecordOk:
      description: 현재 CareerRecord
      headers:
        ETag:
          $ref: "#/components/headers/RecordETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerRecordResponse"
    CareerRecordTrashed:
      description: 휴지통으로 이동한 CareerRecord의 lifecycle 상태
      headers:
        ETag:
          $ref: "#/components/headers/RecordETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerRecordTrashResponse"
    BadRequest:
      description: 헤더, 경로 또는 본문이 계약에 맞지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    AuthenticationRequired:
      description: 유효한 Bearer 인증이 필요함
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: system PropertyDefinition은 변경할 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    RecordNotFound:
      description: Record가 없거나 인증 사용자가 소유하지 않아 존재 여부를 숨김
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    IdempotencyConflict:
      description: 같은 Idempotency-Key가 다른 생성 요청에 이미 사용됨
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: preview 이후 Record 또는 Category schema가 변경됨
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    PreconditionFailed:
      description: If-Match version이 현재 CareerRecord version보다 오래됨
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InternalError:
      description: canonical 저장 데이터가 계약을 위반함
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  schemas:
    Uuid:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    RecordEtag:
      type: string
      pattern: '^"v[1-9][0-9]*"$'
      examples: ['"v1"', '"v3"']

    PropertyDefinitionType:
      type: string
      enum:
        - text
        - number
        - select
        - multi_select
        - date
        - checkbox
        - url
        - email
        - phone
        - file
        - media
        - relation
        - formula
        - rollup
        - created_time
        - updated_time

    CareerSelectOption:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '\S'
          description: >-
            표시 문자열을 그대로 보존한다. migration은 대소문자, 앞뒤 공백,
            Unicode normalization을 적용하지 않는다.

    CareerSelectConfig:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: array
          maxItems: 100
          x-expresso-uniqueBy: id
          description: option id 중복은 application/domain validation이 거절한다.
          items:
            $ref: "#/components/schemas/CareerSelectOption"

    EmptyPropertyConfig:
      type: object
      additionalProperties: false

    CareerRelationDefinitionConfig:
      type: object
      additionalProperties: false
      required: [targetCategoryId, inversePropertyId, cardinality, deletePolicy]
      properties:
        targetCategoryId:
          $ref: "#/components/schemas/Uuid"
        inversePropertyId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        cardinality:
          type: string
          enum: [single, multiple]
        deletePolicy:
          type: string
          enum: [restrict, nullify]

    CareerFormulaDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message, severity, start, end]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 500
        severity:
          type: string
          enum: [error, warning]
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0

    CareerFormulaDefinitionConfig:
      type: object
      additionalProperties: false
      required: [source, ast, diagnostics]
      properties:
        source:
          type: string
          maxLength: 4000
          description: application validation이 위험한 실행 표현식을 거절한다.
        ast:
          description: parser가 생성한 언어 중립 JSON AST 또는 null
        diagnostics:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CareerFormulaDiagnostic"

    CareerFormulaCreateDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message, severity, start, end]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 500
        severity:
          type: string
          const: warning
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0

    CareerFormulaCreateConfig:
      type: object
      additionalProperties: false
      required: [source, ast, diagnostics]
      properties:
        source:
          type: string
          maxLength: 4000
          not:
            pattern: '\b(?:eval|Function|import|require)\s*\('
        ast:
          description: parser가 생성한 언어 중립 JSON AST 또는 null
        diagnostics:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CareerFormulaCreateDiagnostic"

    CareerRollupDefinitionConfig:
      type: object
      additionalProperties: false
      required: [relationPropertyId, targetPropertyId, aggregation]
      properties:
        relationPropertyId:
          $ref: "#/components/schemas/Uuid"
        targetPropertyId:
          $ref: "#/components/schemas/Uuid"
        aggregation:
          type: string
          enum:
            - count
            - unique_count
            - sum
            - average
            - min
            - max
            - earliest
            - latest
            - percent_checked
            - show_unique

    PropertyDefinition:
      type: object
      additionalProperties: false
      description: >-
        id는 migration 0006의 propertySchema.id와 propertySchemaV2.id가 공유하는
        UUID 계보이며 생성 후 바뀌지 않는다. name이 canonical 표시 이름이다.
        CareerRecord.title은 별도 root field이며 일반 PropertyDefinition이나
        writable PropertyValue로 만들지 않는다.
      required: [id, key, name, type, required, system, config, order, version, deletedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 80
        type:
          $ref: "#/components/schemas/PropertyDefinitionType"
        required:
          type: boolean
        system:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: type별 계약으로 검증하는 설정 객체
        order:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        deletedAt:
          type: [string, "null"]
          format: date-time
      allOf:
        - if:
            properties:
              type:
                enum: [select, multi_select]
            required: [type]
          then:
            properties:
              config:
                $ref: "#/components/schemas/CareerSelectConfig"
        - if:
            properties:
              type:
                const: relation
            required: [type]
          then:
            properties:
              config:
                $ref: "#/components/schemas/CareerRelationDefinitionConfig"
        - if:
            properties:
              type:
                const: formula
            required: [type]
          then:
            properties:
              config:
                $ref: "#/components/schemas/CareerFormulaDefinitionConfig"
        - if:
            properties:
              type:
                const: rollup
            required: [type]
          then:
            properties:
              config:
                $ref: "#/components/schemas/CareerRollupDefinitionConfig"
        - if:
            properties:
              type:
                enum:
                  - text
                  - number
                  - date
                  - checkbox
                  - url
                  - email
                  - phone
                  - file
