      properties:
        text:
          type: string
          maxLength: 200000
        marks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CareerTextMark"

    CareerBlock:
      type: object
      additionalProperties: false
      description: >-
        Editor 기술과 독립적인 semantic block이다. 알려진 type은 allOf의 type별
        invariant를 따르고, 패턴에 맞는 unknown type은 공통 구조를 유지한 채 attrs,
        content와 text를 손실 없이 보존한다.
      x-expresso-knownBlockTypes:
        - paragraph
        - heading1
        - heading2
        - heading3
        - bulletList
        - orderedList
        - taskList
        - listItem
        - blockquote
        - code
        - callout
        - horizontalRule
        - image
        - file
        - table
        - tableRow
        - tableCell
        - evidence
      required: [id, type, attrs]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          pattern: '^[a-z][a-zA-Z0-9_.-]{0,63}$'
        attrs:
          type: object
          additionalProperties: true
        content:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/CareerBlock"
        text:
          type: array
          items:
            $ref: "#/components/schemas/CareerTextSpan"
      allOf:
        - if:
            properties:
              type:
                enum:
                  - paragraph
                  - heading1
                  - heading2
                  - heading3
                  - bulletList
                  - orderedList
                  - taskList
                  - listItem
                  - blockquote
                  - code
                  - callout
                  - horizontalRule
                  - image
                  - file
                  - table
                  - tableRow
                  - tableCell
                  - evidence
            required: [type]
          then:
            properties:
              attrs:
                type: object
                properties:
                  sourceMarkdown:
                    type: string
                additionalProperties: true
        - if:
            properties:
              type:
                enum: [paragraph, heading1, heading2, heading3]
            required: [type]
          then:
            properties:
              content:
                maxItems: 0
        - if:
            properties:
              type:
                const: code
            required: [type]
          then:
            properties:
              content:
                maxItems: 0
              attrs:
                type: object
                properties:
                  language:
                    type: [string, "null"]
                additionalProperties: true
        - if:
            properties:
              type:
                enum: [bulletList, orderedList, taskList]
            required: [type]
          then:
            properties:
              text:
                maxItems: 0
              content:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/CareerBlock"
                    - properties:
                        type:
                          const: listItem
                      required: [type]
        - if:
            properties:
              type:
                const: listItem
            required: [type]
          then:
            properties:
              attrs:
                type: object
                properties:
                  checked:
                    type: boolean
                additionalProperties: true
            not:
              required: [content, text]
              properties:
                content:
                  minItems: 1
                text:
                  minItems: 1
        - if:
            properties:
              type:
                enum: [blockquote, callout]
            required: [type]
          then:
            properties:
              attrs:
                type: object
                properties:
                  icon:
                    type: string
                additionalProperties: true
            not:
              required: [content, text]
              properties:
                content:
                  minItems: 1
                text:
                  minItems: 1
        - if:
            properties:
              type:
                const: horizontalRule
            required: [type]
          then:
            properties:
              content:
                maxItems: 0
              text:
                maxItems: 0
        - if:
            properties:
              type:
                const: image
            required: [type]
          then:
            properties:
              content:
                maxItems: 0
              text:
                maxItems: 0
              attrs:
                type: object
                required: [mediaId]
                properties:
                  mediaId:
                    type: string
                    minLength: 1
                  alt:
                    type: string
                additionalProperties: true
        - if:
            properties:
              type:
                const: file
            required: [type]
          then:
            properties:
              content:
                maxItems: 0
              text:
                maxItems: 0
              attrs:
                type: object
                required: [mediaId, name]
                properties:
                  mediaId:
                    type: string
                    minLength: 1
                  name:
                    type: string
                additionalProperties: true
        - if:
            properties:
              type:
                const: table
            required: [type]
          then:
            properties:
              text:
                maxItems: 0
              content:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/CareerBlock"
                    - properties:
                        type:
                          const: tableRow
                      required: [type]
        - if:
            properties:
              type:
                const: tableRow
            required: [type]
          then:
            properties:
              text:
                maxItems: 0
              content:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/CareerBlock"
                    - properties:
                        type:
                          const: tableCell
                      required: [type]
        - if:
            properties:
              type:
                const: tableCell
            required: [type]
          then:
            not:
              required: [content, text]
              properties:
                content:
                  minItems: 1
                text:
                  minItems: 1
        - if:
            properties:
              type:
                const: evidence
            required: [type]
          then:
            properties:
              content:
                maxItems: 0
              attrs:
                type: object
                required: [source]
                properties:
                  source:
                    type: string
                    minLength: 1
                additionalProperties: true

    BlockBody:
      type: object
      additionalProperties: false
      description: >-
        Career 본문의 schemaVersion 1 semantic state다. x-expresso-invariants는 JSON
        Schema만으로 완전히 표현할 수 없는 document-wide 안전성 규칙을 전달하며,
        extension 자체가 runtime validation을 수행하지 않는다.
      x-expresso-invariants:
        globalBlockIdUnique: true
        maxDepth: 32
        maxBlocks: 20000
        maxAttrsDepth: 16
        maxBlockAttrsBytes: 65536
        maxMarkAttrsBytes: 8192
        maxDocumentBytes: 4194304
        runtimeValidationRequired: true
      required: [schemaVersion, type, content]
      properties:
        schemaVersion:
          type: integer
          const: 1
        type:
          type: string
          const: doc
        content:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/CareerBlock"

    CareerRecord:
      type: object
      additionalProperties: false
      description: >-
        title, propertyValues, blockBody가 새 기록의 canonical 데이터다. status와 bodyMd는
        이 계약에 포함하지 않는다.
      required:
        - id
        - categoryId
        - title
        - propertyValues
        - blockBody
        - version
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        categoryId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          maxLength: 300
        propertyValues:
          $ref: "#/components/schemas/PropertyValues"
        blockBody:
          $ref: "#/components/schemas/BlockBody"
        version:
          type: integer
          minimum: 1
          description: 성공한 변경마다 증가하며 ETag의 숫자와 일치함
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    CreateCareerRecordRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateEmptyCareerRecordRequest"
        - $ref: "#/components/schemas/CreateGroupedCareerRecordRequest"
        - $ref: "#/components/schemas/CreateDuplicateCareerRecordRequest"

    CreateEmptyCareerRecordRequest:
      type: object
      additionalProperties: false
      required: [categoryId]
      properties:
        categoryId:
          $ref: "#/components/schemas/Uuid"

    CreateGroupedCareerRecordRequest:
      type: object
      additionalProperties: false
      required: [categoryId, propertyValues]
      properties:
        categoryId:
          $ref: "#/components/schemas/Uuid"
        propertyValues:
          type: array
          maxItems: 1
          description: 그룹 Quick-Add에서 사용하는 선택형 초기값. 빈 배열은 초기값이 없음을 의미함
          items:
            oneOf:
              - $ref: "#/components/schemas/InitialSelectPropertyValue"
              - $ref: "#/components/schemas/InitialMultiSelectPropertyValue"

    CreateDuplicateCareerRecordRequest:
      type: object
      additionalProperties: false
      required: [categoryId, title, properties, bodyMd]
      description: 현재 Web Record Duplicate의 legacy compatibility snapshot을 그대로 재현하는 전환기 요청
      properties:
        categoryId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          maxLength: 300
        properties:
          type: object
          maxProperties: 50
          propertyNames:
            pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"
          additionalProperties:
            $ref: "#/components/schemas/DuplicateCompatibilityPropertyValue"
        bodyMd:
          type: string
          maxLength: 200000

    DuplicateCompatibilityPropertyValue:
      oneOf:
        - type: string
          maxLength: 5000
        - type: number
        - type: boolean
        - type: array
          maxItems: 100
          items:
            type: string
            maxLength: 200
        - $ref: "#/components/schemas/DuplicateTypedPropertyValue"

    DuplicateTypedPropertyValue:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              const: text
            value:
              type: string
              maxLength: 50000
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              const: number
            value:
              type: number
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              const: checkbox
            value:
              type: boolean
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              const: select
            value:
              oneOf:
                - $ref: "#/components/schemas/Uuid"
                - type: "null"
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              const: multi_select
            value:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/Uuid"
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              const: date
            value:
              type: object
              additionalProperties: false
              required: [start, end, timezone]
              properties:
                start:
                  oneOf:
                    - type: string
                      format: date
                    - type: string
                      format: date-time
                end:
                  oneOf:
                    - type: string
                      format: date
                    - type: string
                      format: date-time
                    - type: "null"
                timezone:
                  oneOf:
                    - type: string
                      minLength: 1
                      maxLength: 64
                    - type: "null"
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              enum: [url, email, phone]
            value:
              type: string
              maxLength: 2000
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              enum: [file, media]
            value:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/Uuid"

    InitialSelectPropertyValue:
      type: object
      additionalProperties: false
      required: [propertyDefinitionId, type, value]
      properties:
        propertyDefinitionId:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          const: select
        value:
          $ref: "#/components/schemas/Uuid"

    InitialMultiSelectPropertyValue:
      type: object
      additionalProperties: false
      required: [propertyDefinitionId, type, value]
      properties:
        propertyDefinitionId:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          const: multi_select
        value:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/Uuid"

    ReplaceCareerRelationTargetsRequest:
      type: object
      additionalProperties: false
      required: [propertyId, targetIds]
      properties:
        propertyId:
          $ref: "#/components/schemas/Uuid"
        targetIds:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Uuid"

    PatchCareerRecordRequest:
      oneOf:
        - $ref: "#/components/schemas/CanonicalCareerRecordPatch"
        - $ref: "#/components/schemas/CareerRecordStatusPatch"

    CanonicalCareerRecordPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 3
      properties:
        title:
          type: string
          maxLength: 300
        propertyValues:
          $ref: "#/components/schemas/PropertyValues"
        blockBody:
          $ref: "#/components/schemas/BlockBody"

    CareerRecordStatusPatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CareerRecordStatus"

    CareerRecordStatus:
      type: string
      description: CareerRecord의 workflow metadata. 상태 의미와 전이 정책은 기존 동작을 유지한다.
      enum: [draft, organized, verified]

    CareerRecordResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CareerRecord"

    CareerRecordListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CareerRecord"
        page:
          $ref: "#/components/schemas/CareerRecordPage"

    CareerRecordPage:
      type: object
      additionalProperties: false
      required: [hasNextPage, nextCursor]
      properties:
        hasNextPage:
          type: boolean
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: "null"

    CareerRecordTrashResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CareerRecordTrashData"

    CareerRecordTrashData:
      type: object
      additionalProperties: false
      required: [id, deletedAt, purgeAfter, version]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        deletedAt:
          $ref: "#/components/schemas/Timestamp"
        purgeAfter:
          $ref: "#/components/schemas/Timestamp"
        version:
          type: integer
          minimum: 2

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - NOT_FOUND
            - VALIDATION_ERROR
            - CONFLICT
            - PRECONDITION_FAILED
            - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          minLength: 8
          maxLength: 128
        details:
          type: object
          additionalProperties: true

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
