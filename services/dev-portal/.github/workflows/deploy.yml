name: 개발 포털 배포

# docs/ 가 바뀌면 Cloudflare Pages 로 올린다. 빌드 단계는 없다.
#
# GitHub Pages 가 아니라 Cloudflare 를 쓰는 이유는 README 참고.
# Pages 프로젝트가 Direct Upload 로 만들어져 있어 Cloudflare 의 Git 연동으로는
# 바꿀 수 없으므로(프로젝트 재생성이 필요) wrangler 로 직접 올린다.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# 연달아 push 하면 마지막 것만 배포한다
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 한글 파일명이 NFD(자모 분리)로 커밋되면 Pages(Linux)는 바이트 그대로
      # 비교하므로 포털 JS 의 NFC 상수와 어긋나 404 가 난다. 배포 전에 막는다.
      - name: 문서 파일명 NFC 검사
        run: |
          python3 - <<'PY'
          import os, sys, unicodedata
          bad = []
          for root, dirs, files in os.walk('docs'):
              for n in dirs + files:
                  if unicodedata.normalize('NFC', n) != n:
                      bad.append(os.path.join(root, n))
          if bad:
              print('NFD 파일명이 있습니다 — Pages 에서 링크가 깨집니다:')
              for p in bad:
                  print('  ', p)
              print('\n고치는 방법: python3 -c "'
                    'import os,unicodedata as u;'
                    "[os.rename(os.path.join(r,n), os.path.join(r,u.normalize('NFC',n)))"
                    " for r,ds,fs in os.walk('docs') for n in ds+fs"
                    " if u.normalize('NFC',n)!=n]\"")
              sys.exit(1)
          print('OK — 전부 NFC')
          PY

      # 포털이 참조하는 파일이 실제로 있는지 확인한다.
      # 포털 JS 는 문서 파일명을 문자열 상수로 들고 있어서, 이름이 바뀌면
      # 조용히 404 가 될 뿐 빌드가 깨지지 않는다.
      - name: 진입점과 런타임 존재 확인
        run: |
          for f in "docs/index.html" "docs/support.js" "docs/task-spec.js" \
                   "docs/screen-map.js" "docs/Expresso 개발 포털.dc.html"; do
            if [ ! -f "$f" ]; then echo "없음: $f"; exit 1; fi
          done
          echo "OK — 필수 파일 확인"

      - name: Cloudflare Pages 배포
        run: |
          npx --yes wrangler@4 pages deploy docs \
            --project-name=expresso-dev-portal \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 배포 결과 확인
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -A 'Mozilla/5.0 (compatible; expresso-ci)' \
              https://expresso-dev-portal.pages.dev/)
            echo "시도 $i — HTTP $code"
            if [ "$code" = "200" ]; then echo "배포 확인"; exit 0; fi
            sleep 15
          done
          echo "5분 내에 200 을 받지 못했습니다 (전파 지연일 수 있습니다)"
          exit 1
