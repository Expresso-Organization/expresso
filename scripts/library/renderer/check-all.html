<!doctype html><html lang="ko"><meta charset="utf-8"><title>전체 실행 예제 검증</title><style>body{font:14px system-ui;margin:24px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.box{height:125px;overflow:hidden;border:1px solid #ddd}iframe{width:1280px;height:880px;border:0;transform:scale(.16);transform-origin:0 0}button{padding:10px}pre{white-space:pre-wrap}</style><h1>전체 실행 예제 검증</h1><p>원본 코드와 데모 입력을 격리된 iframe에서 실행합니다.</p><button id="start">검증 시작</button><output id="progress">대기</output><pre id="failures"></pre><div id="grid"></div><script>
let queue=[],done=0,total=0,active=new Map(),failures=[];const progress=document.getElementById('progress');
function update(){progress.textContent=`완료 ${done} / ${total} · 진행 ${active.size} · 실패 ${failures.length}`;document.getElementById('failures').textContent=failures.slice(-12).join('\n');}
async function finish(win,data){const a=active.get(win);if(!a||a.saving)return;a.saving=true;clearTimeout(a.timer);
try{const response=await fetch('/__example-result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!response.ok)throw new Error('HTTP '+response.status);}
catch(error){failures.push(a.item.name+': 결과 저장 실패 '+error.message);const retry=document.createElement('button');retry.textContent='결과 저장 다시 시도';retry.onclick=()=>{retry.remove();a.saving=false;finish(win,data)};a.article.append(retry);update();return;}
active.delete(win);if(data.status!=='ready')failures.push(a.item.name+': '+data.status+' '+data.reason);done++;a.article.remove();pump();}
function pump(){while(active.size<Number(new URLSearchParams(location.search).get("parallel")||6)&&queue.length){const item=queue.shift(),article=document.createElement('article'),frame=document.createElement('iframe'),box=document.createElement('div');article.append(item.name);box.className='box';frame.sandbox='allow-scripts';frame.src='/docs/'+item.url.slice(2);box.append(frame);article.append(box);document.getElementById('grid').append(article);const win=frame.contentWindow,timer=setTimeout(()=>finish(win,{id:item.id,status:'timeout',reason:'30초 내 결과 없음'}),30000);active.set(win,{item,article,timer});}update();}
addEventListener('message',e=>{const a=active.get(e.source);if(!a||e.data.type!=='expresso-all-preview'||e.data.id!==a.item.id)return;finish(e.source,e.data)});
document.getElementById('start').onclick=async()=>{document.getElementById('start').disabled=true;const all=await fetch('/docs/library/previews/examples/build-results.json').then(r=>r.json());let prior={results:{}};try{prior=await fetch('/docs/library/previews/examples/verification.json').then(r=>r.json())}catch{}const names=new URLSearchParams(location.search).get('names')?.split(',');queue=all.filter(i=>i.status==='built'&&(names?names.includes(i.name):prior.results[i.id]?.status!=='ready'));total=queue.length;pump();};
</script></html>
