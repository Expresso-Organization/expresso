name: 백엔드 CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "services/backend/**"
      - "services/web/**"
      - "packages/contracts/**"
      - "packages/editor/**"
      - "packages/portfolio-renderer/**"
      - "packages/database/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR이면 늘 시작하고, 바뀐 파일이 이 검사와 관계없으면 아래 검사 작업을 건너뛴다. 건너뛴 작업은 성공으로
  # 보고되어 main 보호 규칙의 필수 검사(백엔드 검사)를 채운다. 경로 필터로 워크플로 자체가 시작하지 않으면 필수
  # 검사가 오지 않아 PR이 막힌다.
  changes:
    name: 변경 범위
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERN: '^(services/(backend|web)/|packages/(contracts|editor|portfolio-renderer|database)/|infra/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/backend-ci\.yml$)'
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: 백엔드 검사
    needs: changes
    # 변경 범위를 못 읽었으면 건너뛰지 않고 검사한다. 건너뛰면 통과로 보고되기 때문이다.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      MONGODB_URL: mongodb://expresso_runtime:expresso_runtime@127.0.0.1:57017/expresso?authSource=expresso&replicaSet=rs0
      MONGODB_MIGRATE_URL: mongodb://expresso_migration:expresso_migration@127.0.0.1:57017/expresso?authSource=expresso&replicaSet=rs0
      MONGODB_DATABASE: expresso
      TEST_MONGODB_URL: mongodb://admin:expresso-admin@127.0.0.1:57017/?authSource=admin&replicaSet=rs0
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7

      # setup-node의 cache: pnpm은 pnpm이 이미 PATH에 있어야 동작한다.
      # 그래서 pnpm을 먼저 깐다. 버전은 package.json의 packageManager를
      # 읽으므로 여기에 다시 적지 않는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: MongoDB replica set 준비
        run: pnpm infra:mongodb:up

      # 준비가 실패하면 Compose는 「unhealthy」 한 줄만 남긴다. mongod가 왜 멈췄는지는
      # 컨테이너 로그에 있다. 정보(I) 줄은 걸러 경고 · 오류 · 치명 줄만 남긴다.
      - name: MongoDB 준비 실패 로그
        if: failure()
        run: |
          uname -r
          docker compose -f infra/compose.mongodb.yaml ps -a
          docker compose -f infra/compose.mongodb.yaml logs --no-color mongodb | grep -vE '"s":"I"' | tail -60

      # 테스트는 계약과 스키마를 dist로 불러온다. 지어 두지 않으면 vitest가
      # @expresso/contracts를 찾지 못한다. 순서는 deploy.sh와 같다 — 배포와
      # CI가 다른 순서로 지으면 한쪽에서만 깨진다.
      - name: 계약 · 스키마 빌드
        run: |
          pnpm --filter @expresso/editor build
          pnpm --filter @expresso/contracts build
          pnpm --filter @expresso/database build

      - name: 마이그레이션
        run: pnpm db:migrate

      - name: 타입 검사
        run: pnpm typecheck

      # 생성 중 측정기 테스트가 실제 Chromium을 띄웁니다.
      # 러너는 실행마다 새 VM이라 받은 브라우저가 남지 않는다. 판은 잠금 파일의 Playwright 버전으로 정해지므로
      # 그 해시로 캐시한다. --with-deps는 쓰지 않는다 — ubuntu 러너 이미지에 Chrome 실행 라이브러리가 이미 있고,
      # --with-deps가 더하는 것은 대부분 CJK · 다국어 글꼴(약 21MB)이다. 그 글꼴을 apt 미러에서 150kB/s로
      # 받느라 매번 2분 남짓 걸렸다(2026-11-10 실측). 픽셀 비교는 macOS에서만 한다(career-editor.visual.spec.ts).
      - name: Chromium 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Chromium 설치
        run: pnpm --filter @expresso/web exec playwright install chromium

      # 작업 전체에 TEST_MONGODB_URL이 있으므로 백엔드의 통합 테스트(*.integration.test.ts)와
      # test/e2e도 여기서 실제 Mongo · Redis로 돈다. 따로 다시 돌리는 단계를 두지 않는다.
      # 웹 단위 테스트는 웹 CI가 같은 경로 변경에서 돌리므로 여기서 뺀다.
      - name: 단위 · 통합 테스트
        run: pnpm --recursive --if-present --workspace-concurrency=1 --filter '!@expresso/web' test
        env:
          REQUIRE_BROWSER: "1"

      - name: 수식 보안 source scan
        run: |
          ! rg -n 'eval\(|new Function|Function\(' packages/editor/src/formula

      # 다른 파일이 같은 데이터베이스를 두드리는 동안 잰 p95 는 그 경로의 값이
      # 아니다. 혼자 돌린다.
      - name: 성능 예산
        run: pnpm --filter @expresso/backend test:load

      - name: 빌드
        run: pnpm build

  # 브라우저 E2E는 단위 · 통합 테스트와 서로 기다릴 이유가 없다. 따로 돌려 전체 대기를 줄인다.
  e2e:
    needs: changes
    # 변경 범위를 못 읽었으면 건너뛰지 않고 검사한다. 건너뛰면 통과로 보고되기 때문이다.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      MONGODB_URL: mongodb://expresso_runtime:expresso_runtime@127.0.0.1:57017/expresso?authSource=expresso&replicaSet=rs0
      MONGODB_MIGRATE_URL: mongodb://expresso_migration:expresso_migration@127.0.0.1:57017/expresso?authSource=expresso&replicaSet=rs0
      MONGODB_DATABASE: expresso
      TEST_MONGODB_URL: mongodb://admin:expresso-admin@127.0.0.1:57017/?authSource=admin&replicaSet=rs0
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7

      # setup-node의 cache: pnpm은 pnpm이 이미 PATH에 있어야 동작한다.
      # 그래서 pnpm을 먼저 깐다. 버전은 package.json의 packageManager를
      # 읽으므로 여기에 다시 적지 않는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: MongoDB replica set 준비
        run: pnpm infra:mongodb:up

      # 준비가 실패하면 Compose는 「unhealthy」 한 줄만 남긴다. mongod가 왜 멈췄는지는
      # 컨테이너 로그에 있다. 정보(I) 줄은 걸러 경고 · 오류 · 치명 줄만 남긴다.
      - name: MongoDB 준비 실패 로그
        if: failure()
        run: |
          uname -r
          docker compose -f infra/compose.mongodb.yaml ps -a
          docker compose -f infra/compose.mongodb.yaml logs --no-color mongodb | grep -vE '"s":"I"' | tail -60

      # API · 워커 · 웹 개발 서버가 워크스페이스 패키지를 dist로 읽는다.
      - name: 워크스페이스 패키지 빌드
        run: pnpm --filter "@expresso/backend^..." --filter "@expresso/web^..." build

      # 러너는 실행마다 새 VM이라 받은 브라우저가 남지 않는다. 판은 잠금 파일의 Playwright 버전으로 정해지므로
      # 그 해시로 캐시한다. --with-deps는 쓰지 않는다 — ubuntu 러너 이미지에 Chrome 실행 라이브러리가 이미 있고,
      # --with-deps가 더하는 것은 대부분 CJK · 다국어 글꼴(약 21MB)이다. 그 글꼴을 apt 미러에서 150kB/s로
      # 받느라 매번 2분 남짓 걸렸다(2026-11-10 실측). 픽셀 비교는 macOS에서만 한다(career-editor.visual.spec.ts).
      - name: Chromium 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Chromium 설치
        run: pnpm --filter @expresso/web exec playwright install chromium

      # 마이그레이션은 Playwright webServer가 E2E 전용 DB에 직접 돌린다(playwright.config.ts).
      - name: 커리어 편집기 브라우저 E2E
        run: pnpm --filter @expresso/web exec playwright test
