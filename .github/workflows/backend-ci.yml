name: 백엔드 CI

on:
  pull_request:
    paths:
      - "services/backend/**"
      - "services/web/**"
      - "packages/contracts/**"
      - "packages/editor/**"
      - "packages/database/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/backend/**"
      - "services/web/**"
      - "packages/contracts/**"
      - "packages/editor/**"
      - "packages/database/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      MONGODB_URL: mongodb://expresso_runtime:expresso_runtime@127.0.0.1:57017/expresso?authSource=expresso&replicaSet=rs0
      MONGODB_MIGRATE_URL: mongodb://expresso_migration:expresso_migration@127.0.0.1:57017/expresso?authSource=expresso&replicaSet=rs0
      MONGODB_DATABASE: expresso
      TEST_MONGODB_URL: mongodb://admin:expresso-admin@127.0.0.1:57017/?authSource=admin&replicaSet=rs0
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7

      # setup-node의 cache: pnpm은 pnpm이 이미 PATH에 있어야 동작한다.
      # 그래서 pnpm을 먼저 깐다. 버전은 package.json의 packageManager를
      # 읽으므로 여기에 다시 적지 않는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: MongoDB replica set 준비
        run: pnpm infra:mongodb:up

      # 테스트는 계약과 스키마를 dist로 불러온다. 지어 두지 않으면 vitest가
      # @expresso/contracts를 찾지 못한다. 순서는 deploy.sh와 같다 — 배포와
      # CI가 다른 순서로 지으면 한쪽에서만 깨진다.
      - name: 계약 · 스키마 빌드
        run: |
          pnpm --filter @expresso/editor build
          pnpm --filter @expresso/contracts build
          pnpm --filter @expresso/database build

      - name: 마이그레이션
        run: pnpm db:migrate

      - name: 타입 검사
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 실제 인프라 통합 테스트
        run: pnpm --filter @expresso/backend test:infra

      - name: WebSocket · AI deterministic 통합 테스트
        run: pnpm --filter @expresso/backend exec vitest run src/modules/career-editor/socket.integration.test.ts src/modules/career-editor/ai-proposals.integration.test.ts

      - name: 수식 보안 source scan
        run: |
          ! rg -n 'eval\(|new Function|Function\(' packages/editor/src/formula

      # 다른 파일이 같은 데이터베이스를 두드리는 동안 잰 p95 는 그 경로의 값이
      # 아니다. 혼자 돌린다.
      - name: 성능 예산
        run: pnpm --filter @expresso/backend test:load

      - name: Chromium 설치
        run: pnpm --filter @expresso/web exec playwright install --with-deps chromium

      - name: 커리어 편집기 브라우저 E2E
        run: pnpm --filter @expresso/web exec playwright test

      - name: 빌드
        run: pnpm build
