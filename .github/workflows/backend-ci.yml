name: 백엔드 CI

on:
  pull_request:
    paths:
      - "services/backend/**"
      - "packages/contracts/**"
      - "packages/database/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/backend/**"
      - "packages/contracts/**"
      - "packages/database/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: expresso
          POSTGRES_USER: expresso
          POSTGRES_PASSWORD: expresso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expresso -d expresso"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://expresso:expresso@127.0.0.1:5432/expresso
      TEST_DATABASE_URL: postgres://expresso:expresso@127.0.0.1:5432/expresso
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7

      # setup-node의 cache: pnpm은 pnpm이 이미 PATH에 있어야 동작한다.
      # 그래서 pnpm을 먼저 깐다. 버전은 package.json의 packageManager를
      # 읽으므로 여기에 다시 적지 않는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 마이그레이션
        run: pnpm db:migrate

      - name: 타입 검사
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 실제 인프라 통합 테스트
        run: pnpm --filter @expresso/backend test:infra

      - name: 빌드
        run: pnpm build
