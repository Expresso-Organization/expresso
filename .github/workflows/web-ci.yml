name: 웹 CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "services/web/**"
      - "packages/contracts/**"
      - "packages/editor/**"
      - "packages/portfolio-renderer/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR이면 늘 시작하고, 바뀐 파일이 이 검사와 관계없으면 아래 검사 작업을 건너뛴다. 건너뛴 작업은 성공으로
  # 보고되어 main 보호 규칙의 필수 검사(웹 검사)를 채운다. 경로 필터로 워크플로 자체가 시작하지 않으면 필수
  # 검사가 오지 않아 PR이 막힌다.
  changes:
    name: 변경 범위
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERN: '^(services/web/|packages/(contracts|editor|portfolio-renderer)/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|\.github/workflows/web-ci\.yml$)'
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: 웹 검사
    needs: changes
    # 변경 범위를 못 읽었으면 건너뛰지 않고 검사한다. 건너뛰면 통과로 보고되기 때문이다.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # setup-node의 cache: pnpm은 pnpm이 이미 PATH에 있어야 동작한다.
      # 그래서 pnpm을 먼저 깐다. 버전은 package.json의 packageManager를
      # 읽으므로 여기에 다시 적지 않는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 웹은 contracts의 타입을 그대로 쓰므로 계약이 먼저 빌드되어야 한다.
      - name: 계약 · 편집기 빌드
        run: |
          pnpm --filter @expresso/editor build
          pnpm --filter @expresso/contracts build

      - name: 타입 검사
        run: pnpm --filter @expresso/web typecheck

      - name: 웹 단위 테스트
        run: pnpm --filter @expresso/web test

      - name: 빌드
        run: pnpm --filter @expresso/web build
