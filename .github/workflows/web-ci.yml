name: 웹 CI

on:
  pull_request:
    paths:
      - "services/web/**"
      - "packages/contracts/**"
      - "packages/editor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/web/**"
      - "packages/contracts/**"
      - "packages/editor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # setup-node의 cache: pnpm은 pnpm이 이미 PATH에 있어야 동작한다.
      # 그래서 pnpm을 먼저 깐다. 버전은 package.json의 packageManager를
      # 읽으므로 여기에 다시 적지 않는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 웹은 contracts의 타입을 그대로 쓰므로 계약이 먼저 빌드되어야 한다.
      - name: 계약 · 편집기 빌드
        run: |
          pnpm --filter @expresso/editor build
          pnpm --filter @expresso/contracts build

      - name: 타입 검사
        run: pnpm --filter @expresso/web typecheck

      - name: 웹 단위 테스트
        run: pnpm --filter @expresso/web test

      - name: 빌드
        run: pnpm --filter @expresso/web build
