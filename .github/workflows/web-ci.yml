name: 웹 CI

on:
  pull_request:
    paths:
      - "services/web/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/web/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: pnpm 활성화
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 웹은 contracts의 타입을 그대로 쓰므로 계약이 먼저 빌드되어야 한다.
      - name: 계약 빌드
        run: pnpm --filter @expresso/contracts build

      - name: 타입 검사
        run: pnpm --filter @expresso/web typecheck

      - name: 빌드
        run: pnpm --filter @expresso/web build
