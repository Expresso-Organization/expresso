name: 운영 배포

# main이 바뀌면 expresso.ai.kr로 올린다. 서버에서 도는 것은
# scripts/operations/deploy.sh 하나이고, 여기서는 그것을 SSH로 부를 뿐이다.
# 사람이 손으로 배포할 때도 같은 스크립트를 쓴다 — 두 경로가 갈리면
# "CI에서는 되는데 손으로는 안 되는" 상태가 생긴다.
on:
  push:
    branches: [main]
    paths:
      - "services/backend/**"
      - "services/web/**"
      - "packages/**"
      - "scripts/operations/deploy.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# 배포는 겹치면 안 된다. 앞선 배포가 마이그레이션 도중일 수 있다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 호스트 키를 시크릿으로 고정한다. ssh-keyscan으로 그때그때 받으면
          # 중간자 공격을 그대로 신뢰하게 된다.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 배포
        run: |
          ssh -o IdentitiesOnly=yes \
              -i ~/.ssh/id_ed25519 \
              -p "${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
              "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
              "bash -lc 'cd /opt/expresso && git fetch origin main && scripts/operations/deploy.sh ${{ github.sha }}'"

      - name: 배포 실패 시 로그
        if: failure()
        run: |
          ssh -o IdentitiesOnly=yes \
              -i ~/.ssh/id_ed25519 \
              -p "${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
              "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
              "bash -lc 'journalctl -u expresso-api -u expresso-web -u expresso-worker -n 60 --no-pager'" \
            || echo "로그를 가져오지 못했습니다"
