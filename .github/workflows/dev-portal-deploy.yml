name: 개발 포털 배포

# 개발 포털 문서가 바뀌면 Cloudflare Pages로 올린다. 빌드 단계는 없다.
on:
  push:
    branches: [main]
    paths:
      - "services/dev-portal/docs/**"
      - ".github/workflows/dev-portal-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-portal-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dev-portal

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 문서 파일명 NFC 검사
        run: |
          python3 - <<'PY'
          import os, sys, unicodedata
          bad = []
          for root, dirs, files in os.walk('docs'):
              for name in dirs + files:
                  if unicodedata.normalize('NFC', name) != name:
                      bad.append(os.path.join(root, name))
          if bad:
              print('NFD 파일명이 있습니다 — Pages에서 링크가 깨집니다:')
              for path in bad:
                  print('  ', path)
              sys.exit(1)
          print('OK — 전부 NFC')
          PY

      - name: 진입점과 런타임 존재 확인
        run: |
          for file in "docs/index.html" "docs/support.js" "docs/task-spec.js" \
                      "docs/screen-map.js" "docs/Expresso 개발 포털.dc.html"; do
            if [ ! -f "$file" ]; then echo "없음: $file"; exit 1; fi
          done
          echo "OK — 필수 파일 확인"

      - name: Cloudflare Pages 배포
        run: |
          npx --yes wrangler@4 pages deploy docs \
            --project-name=expresso-dev-portal \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 배포 결과 확인
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -A 'Mozilla/5.0 (compatible; expresso-ci)' \
              https://expresso-dev-portal.pages.dev/)
            echo "시도 $attempt — HTTP $code"
            if [ "$code" = "200" ]; then echo "배포 확인"; exit 0; fi
            sleep 15
          done
          echo "5분 내에 200을 받지 못했습니다 (전파 지연일 수 있습니다)"
          exit 1

