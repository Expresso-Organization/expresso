name: expresso-local

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: expresso
      POSTGRES_USER: expresso
      POSTGRES_PASSWORD: expresso
    ports:
      - "${EXPRESSO_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expresso -d expresso"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-postgres:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${EXPRESSO_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-redis:/data
    restart: unless-stopped

volumes:
  expresso-postgres:
  expresso-redis:
