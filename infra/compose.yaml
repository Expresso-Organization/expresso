name: expresso-local

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: expresso
      MYSQL_USER: expresso
      MYSQL_PASSWORD: expresso
      MYSQL_ROOT_PASSWORD: expresso
    ports:
      - "${EXPRESSO_MYSQL_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uexpresso", "-pexpresso"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - expresso-mysql:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${EXPRESSO_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-redis:/data
    restart: unless-stopped

volumes:
  expresso-mysql:
  expresso-redis:
