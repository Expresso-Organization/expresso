name: expresso-local

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: expresso
      POSTGRES_USER: expresso
      POSTGRES_PASSWORD: expresso
    ports:
      - "${EXPRESSO_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expresso -d expresso"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-postgres:/var/lib/postgresql
    restart: unless-stopped

  # MySQL 전환 중입니다 — 두 데이터베이스를 함께 띄워 두고 옮깁니다.
  # 전환이 끝나면 postgres 서비스와 볼륨을 지웁니다.
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: expresso
      MYSQL_USER: expresso
      MYSQL_PASSWORD: expresso
      MYSQL_ROOT_PASSWORD: expresso
    ports:
      - "${EXPRESSO_MYSQL_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uexpresso", "-pexpresso"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - expresso-mysql:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${EXPRESSO_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-redis:/data
    restart: unless-stopped

volumes:
  expresso-postgres:
  expresso-mysql:
  expresso-redis:
