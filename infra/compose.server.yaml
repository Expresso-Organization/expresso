name: expresso-server

# 서버용 인프라. 로컬(`compose.yaml`)과 다른 점은 셋이다.
#
# 1. **바깥에 열지 않는다.** 포트를 `127.0.0.1`에만 묶는다 — 이 서버는 다른
#    서비스와 함께 쓰는 공용 기계이고, 앞단에는 이미 nginx가 있다.
# 2. **재시작에 살아남는다.** `restart: unless-stopped`.
# 3. 이름을 나눈다(`expresso-server`). 같은 기계의 다른 프로젝트 컨테이너와
#    섞이면 정리할 때 남의 것을 지운다.

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: expresso
      POSTGRES_USER: expresso
      # 비밀번호는 `.env`에서 온다. 저장소에 적지 않는다.
      POSTGRES_PASSWORD: ${EXPRESSO_POSTGRES_PASSWORD:?set EXPRESSO_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${EXPRESSO_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expresso -d expresso"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-postgres:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${EXPRESSO_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-redis:/data
    restart: unless-stopped

volumes:
  expresso-postgres:
  expresso-redis:
