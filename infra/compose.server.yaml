name: expresso-server

# 서버에서도 로컬/CI와 같은 digest와 초기화 스크립트를 사용한다. 모든 데이터
# 포트는 loopback에만 열며, 기존 expresso-mysql volume은 참조하거나 지우지 않는다.
services:
  mongodb-keyfile:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ["/bin/sh", "/usr/local/bin/prepare-keyfile.sh"]
    volumes:
      - expresso-server-mongodb-keyfile:/run/mongodb
      - ./mongodb/prepare-keyfile.sh:/usr/local/bin/prepare-keyfile.sh:ro
    restart: "no"

  mongodb:
    image: mongo:8.0@sha256:02a0cc7939f5ed38f30f9bc714ef5f682d49baf9350c54acf302ce833087fe8a
    depends_on:
      mongodb-keyfile:
        condition: service_completed_successfully
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "57017", "--auth", "--keyFile", "/run/mongodb/mongodb-keyfile"]
    environment:
      MONGO_INITDB_DATABASE: ${EXPRESSO_MONGODB_DATABASE:-expresso}
      MONGO_INITDB_ROOT_USERNAME: ${EXPRESSO_MONGODB_ADMIN_USERNAME:?set EXPRESSO_MONGODB_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${EXPRESSO_MONGODB_ADMIN_PASSWORD:?set EXPRESSO_MONGODB_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${EXPRESSO_MONGODB_PORT:-57017}:57017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --port 57017 --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep -q '^1$'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - expresso-server-mongodb-data:/data/db
      - expresso-server-mongodb-keyfile:/run/mongodb:ro
    restart: unless-stopped

  mongodb-init:
    image: mongo:8.0@sha256:02a0cc7939f5ed38f30f9bc714ef5f682d49baf9350c54acf302ce833087fe8a
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["mongosh"]
    command: ["--quiet", "mongodb://mongodb:57017/admin?directConnection=true", "--file", "/scripts/init-replica-set.js"]
    environment:
      MONGO_DATABASE: ${EXPRESSO_MONGODB_DATABASE:-expresso}
      MONGO_INITDB_ROOT_USERNAME: ${EXPRESSO_MONGODB_ADMIN_USERNAME:?set EXPRESSO_MONGODB_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${EXPRESSO_MONGODB_ADMIN_PASSWORD:?set EXPRESSO_MONGODB_ADMIN_PASSWORD}
      MONGO_RUNTIME_USERNAME: ${EXPRESSO_MONGODB_RUNTIME_USERNAME:?set EXPRESSO_MONGODB_RUNTIME_USERNAME}
      MONGO_RUNTIME_PASSWORD: ${EXPRESSO_MONGODB_RUNTIME_PASSWORD:?set EXPRESSO_MONGODB_RUNTIME_PASSWORD}
      MONGO_MIGRATION_USERNAME: ${EXPRESSO_MONGODB_MIGRATION_USERNAME:?set EXPRESSO_MONGODB_MIGRATION_USERNAME}
      MONGO_MIGRATION_PASSWORD: ${EXPRESSO_MONGODB_MIGRATION_PASSWORD:?set EXPRESSO_MONGODB_MIGRATION_PASSWORD}
      MONGO_REPLICA_SET_NAME: rs0
      MONGO_REPLICA_SET_MEMBER_HOST: localhost:57017
    volumes:
      - ./mongodb/init-replica-set.js:/scripts/init-replica-set.js:ro
    restart: "no"

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${EXPRESSO_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-server-redis:/data
    restart: unless-stopped

volumes:
  expresso-server-mongodb-data:
  expresso-server-mongodb-keyfile:
  expresso-server-redis:
