name: expresso-server

# 서버용 인프라. 로컬(`compose.yaml`)과 다른 점은 셋이다.
#
# 1. **바깥에 열지 않는다.** 포트를 `127.0.0.1`에만 묶는다 — 이 서버는 다른
#    서비스와 함께 쓰는 공용 기계이고, 앞단에는 이미 nginx가 있다.
# 2. **재시작에 살아남는다.** `restart: unless-stopped`.
# 3. 이름을 나눈다(`expresso-server`). 같은 기계의 다른 프로젝트 컨테이너와
#    섞이면 정리할 때 남의 것을 지운다.

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # 마이그레이션이 트리거와 저장 프로시저를 만든다. 바이너리 로그가 켜져
      # 있으면 MySQL 은 그것을 만드는 사람에게 SUPER 를 요구한다 — 문장을
      # 그대로 되감아 실행하던 시절의 규칙이다. 8.4 는 행 단위로만 기록하므로
      # 되감을 문장이 없고, 앱 계정에 SUPER 를 주는 대신 이 검사를 끈다.
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: expresso
      MYSQL_USER: expresso
      # 비밀번호는 `.env`에서 온다. 저장소에 적지 않는다.
      MYSQL_PASSWORD: ${EXPRESSO_MYSQL_PASSWORD:?set EXPRESSO_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${EXPRESSO_MYSQL_PASSWORD:?set EXPRESSO_MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${EXPRESSO_MYSQL_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uexpresso", "-p${EXPRESSO_MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - expresso-mysql:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${EXPRESSO_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - expresso-redis:/data
    restart: unless-stopped

volumes:
  expresso-mysql:
  expresso-redis:
