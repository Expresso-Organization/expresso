# expresso.ai.kr
#
# 앞단은 이 기계의 호스트 nginx다. Expresso의 두 프로세스는 루프백에만 열려 있고
# (웹 3500 · API 4500), 바깥으로 나가는 문은 여기 하나다.
#
# `/v1/`을 API로 따로 보내는 이유 — 배포된 지면이 그림을 `/v1/media/<id>`로
# 가리키고, 공개 포트폴리오와 방문 기록도 같은 접두어를 쓴다. 브라우저가 직접
# 부르는 경로라 웹 서버를 거치게 두면 한 번 더 돌아간다.

server {
    listen 80;
    listen [::]:80;
    server_name expresso.ai.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expresso.ai.kr;

    ssl_certificate /etc/letsencrypt/live/expresso.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expresso.ai.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 미디어 업로드 상한과 맞춘다(MEDIA_MAX_BYTES = 8MB). 여기서 먼저 잘리면
    # 앱이 내려 주는 이유 대신 nginx의 413이 나가고, 화면은 그 이유를 못 말한다.
    client_max_body_size 8m;

    location /v1/ {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 생성 계약은 모델을 기다린다. 기본 60초로는 지면 한 장을 못 받는다.
        proxy_read_timeout 900;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
