# dev.expresso.ai.kr — 개발 포털
#
# 제품(expresso.ai.kr)과 달리 앱이 없다. 문서 HTML과 그 옆의 스크립트뿐이라
# nginx가 파일을 그대로 내보낸다. 프록시도 업스트림도 없다.
#
# 지면은 `/var/www/dev.expresso.ai.kr`에서 나간다. 서버의 작업 트리
# (`~/expresso/docs`)를 직접 가리키지 않는 이유는 두 가지다 — 호스트 nginx가
# www-data 로 도는데 `/home/ubuntu`가 700이라 그 밑을 읽지 못하고, 작업 트리를
# 그대로 열면 서버에서 브랜치를 바꾸는 순간 공개된 문서가 함께 바뀐다.
# `scripts/deploy-dev-portal.sh`가 pull 뒤에 이 디렉터리로 옮긴다.

server {
    listen 80;
    listen [::]:80;
    server_name dev.expresso.ai.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.expresso.ai.kr;

    ssl_certificate /etc/letsencrypt/live/dev.expresso.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.expresso.ai.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dev.expresso.ai.kr;
    index index.html;

    # 문서 이름이 한글이고 공백이 들어간다("Expresso 개발 포털.dc.html").
    # charset 을 주지 않으면 브라우저가 본문을 latin-1 로 읽어 글자가 깨진다.
    charset utf-8;
    charset_types text/css application/javascript text/plain;   # text/html 은 기본 포함

    # 목록을 열어 주지 않는다. 포털은 index.html 에서 시작한다.
    autoindex off;

    # 문서는 자주 바뀌고 크지 않다. 오래 캐시하면 고친 것이 안 보인다는
    # 신고가 먼저 오므로 짧게 두고 검증에 맡긴다.
    # 색인은 원하지 않는다 — docs/robots.txt 와 같은 뜻을 헤더로도 말한다.
    # 파일을 못 읽는 크롤러가 있어 둘 다 둔다.
    #
    # 두 헤더가 한 블록에 함께 있어야 한다. nginx 의 add_header 는 안쪽 블록에
    # 하나라도 있으면 바깥 것을 물려받지 않는다 — 나눠 적으면 조용히 하나가 빠진다.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    access_log /var/log/nginx/dev.expresso.ai.kr.access.log;
    error_log  /var/log/nginx/dev.expresso.ai.kr.error.log;
}
