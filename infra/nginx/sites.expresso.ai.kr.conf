# *.expresso.ai.kr — 공개 포트폴리오
#
# 배포한 포트폴리오는 {주소}.expresso.ai.kr로 열린다. 와일드카드 하나로 받아 같은
# 웹 · API로 보낸다. 어느 주소가 어느 포트폴리오인지는 웹의 프록시(services/web/src/proxy.ts)가
# Host를 보고 정한다. dev.expresso.ai.kr처럼 이름을 적은 vhost는 nginx가 와일드카드보다
# 먼저 고르므로 영향이 없다.
#
# 인증서는 DNS-01로만 받을 수 있다. 발급 · 갱신 절차는 docs/operations/ORACLE_HOSTING.md
# 「공개 포트폴리오 주소」에 있다.

server {
    listen 80;
    listen [::]:80;
    server_name *.expresso.ai.kr;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.expresso.ai.kr;

    ssl_certificate /etc/letsencrypt/live/expresso.ai.kr-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expresso.ai.kr-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 지면의 그림은 /v1/media/<id>로 온다. 상대 경로라 공개 주소 아래에서도 이 경로로 풀린다.
    location /v1/ {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    access_log /var/log/nginx/sites.expresso.ai.kr.access.log;
    error_log  /var/log/nginx/sites.expresso.ai.kr.error.log;
}
